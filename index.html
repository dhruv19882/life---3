<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="LifeOS: goals, to-dos, social media limits, budget, fitness and gym coach in one app." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LifeOS" />
  <title>LifeOS</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Shared SVG gradients used by rings and charts -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
      <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
      <linearGradient id="g-warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#facc15"/></linearGradient>
      <linearGradient id="g-red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
      <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
      <linearGradient id="g-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    </defs>
  </svg>

  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <div class="tab-indicator" id="tabIndicator"></div>
    <button class="tab" data-act="go" data-r="home"><i data-icon="home"></i><span>Home</span></button>
    <button class="tab" data-act="go" data-r="goals"><i data-icon="target"></i><span>Goals</span></button>
    <button class="tab" data-act="go" data-r="social"><i data-icon="phone"></i><span>Social</span></button>
    <button class="tab" data-act="go" data-r="money"><i data-icon="wallet"></i><span>Money</span></button>
    <button class="tab" data-act="go" data-r="gym"><i data-icon="dumbbell"></i><span>Gym</span></button>
  </nav>

  <div id="sheets"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="restTimer" class="rest-timer" hidden></div>
  <canvas id="confetti" class="confetti"></canvas>

  <script src="js/core.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/goals.js"></script>
  <script src="js/views/social.js"></script>
  <script src="js/views/money.js"></script>
  <script src="js/views/gym.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
